name: Publikacja strony

# Każdy push na main przebudowuje stronę. Pierwsze uruchomienie samo włącza
# GitHub Pages, więc nie trzeba nic klikać w ustawieniach repozytorium.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publikacja:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publikuj.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Włącz i skonfiguruj Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Spakuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Opublikuj
        id: publikuj
        uses: actions/deploy-pages@v4
